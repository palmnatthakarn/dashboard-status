<body>
  <script>
    (async function loadLatestFlutterBuild() {
      const resetKey = 'flutter-sw-reset-20260722-smlai-prod';
      const hadServiceWorkerController =
          'serviceWorker' in navigator && navigator.serviceWorker.controller;

      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }
      if ('caches' in window) {
        const cacheNames = await caches.keys();
        await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
      }

      if (hadServiceWorkerController && !sessionStorage.getItem(resetKey)) {
        sessionStorage.setItem(resetKey, '1');
        location.reload();
        return;
      }

      const originalHeadAppend = document.head.append.bind(document.head);
      document.head.append = (...nodes) => {
        for (const node of nodes) {
          if (node instanceof HTMLScriptElement &&
              new URL(node.src, location.href).pathname.endsWith('/main.dart.js')) {
            const mainUrl = new URL(node.src, location.href);
            mainUrl.searchParams.set('v', '20260722-smlai-prod');
            node.src = mainUrl.toString();
          }
        }
        return originalHeadAppend(...nodes);
      };

      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js?v=20260722-smlai-prod';
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })();
  </script>
